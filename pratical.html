<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Doctor Logo</title>
    <style>
        body {
            display: flex;
            justify-content: start;
            align-items: start;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .image-container {
            display: flex;
            align-items: center;
            height: 90%;
            margin-top: -220px;

        }
        .image-container img {
            width: auto;
            height: 100px;
            max-width: 100px;
            height: 12%;
        }
        .image-container span {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: bold ;
            color: rgb(57, 13, 202);
            font-size: 33px;
            margin-left: 0;
            width: 20px;
            box-shadow: rgb(13, 11, 7) rgb(14, 11, 4) rgb(17, 13, 5) rgb(10, 7, 1); 
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="./image/logo.png" alt="Cartoon doctor logo">
        <span>MyDoctor</span>
    </div>
</body>
</html>
